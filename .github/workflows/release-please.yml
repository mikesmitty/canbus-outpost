on:
  push:
    branches:
      - main

name: Release Please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    outputs:
      release-created: ${{ steps.release-please.outputs.release_created }}
      tag-name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}

  build-firmware:
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe needs the tags for the version string

      - name: Host tests
        run: make test

      - name: Set up Pico build
        uses: ./.github/actions/setup-pico

      - name: Build firmware
        run: |
          cmake -B build
          cmake --build build -j"$(nproc)"

      # .uf2 for USB (picotool or drag and drop), .bin for LCC firmware upgrades
      - name: Upload firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          cp build/canbus-outpost.uf2 "canbus-outpost-${VERSION}.uf2"
          cp build/canbus-outpost.bin "canbus-outpost-${VERSION}.bin"
          gh release upload "$TAG_NAME" "canbus-outpost-${VERSION}.uf2" "canbus-outpost-${VERSION}.bin"
