name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Host tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe needs the tags for the version string

      - name: Set up Pico build
        uses: ./.github/actions/setup-pico

      - name: Build firmware
        run: |
          cmake -B build
          cmake --build build -j"$(nproc)"

      - name: Check the image is fit for LCC firmware upgrades
        run: make -C test test_fw_image && cd test && ./test_fw_image

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: canbus-outpost-${{ github.sha }}
          path: |
            build/canbus-outpost.uf2
            build/canbus-outpost.bin
            build/canbus-outpost.elf
          if-no-files-found: error
